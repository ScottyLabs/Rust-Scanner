name: Count Lines with Rust

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  count-lines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install tokei
        run: |
          if ! command -v tokei &> /dev/null; then
            echo "Installing tokei..."
            cargo install tokei --locked
          else
            echo "tokei already installed"
          fi
          tokei --version

      - name: Build Rust application
        run: cargo build --release --verbose

      - name: Run line counter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./target/release/tokei-counter 2>&1 | tee output.log
        continue-on-error: true

      - name: Check if output exists
        run: |
          if [ -f output.log ]; then
            echo "Output log created successfully"
            cat output.log
          else
            echo "No output log found"
          fi

      - name: Upload output log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: line-count-report
          path: output.log
          if-no-files-found: warn

      - name: Create summary
        if: always()
        run: |
          echo "# 📊 Line Count Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f output.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No output generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Analysis completed using Rust + tokei*" >> $GITHUB_STEP_SUMMARY
